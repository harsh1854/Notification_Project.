
spring.application.name=notification-test

# PostgreSQL Test Database
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_test_db
spring.datasource.username=postgres
spring.datasource.password=1854

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Consumer
spring.kafka.consumer.group-id=notification-integration-test-group
spring.kafka.consumer.auto-offset-reset=earliest

# JSON Deserialization
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties[spring.deserializer.key.delegate.class]=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties[spring.json.value.default.type]=com.harsh.notification.messaging.NotificationEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.harsh.notification.messaging

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379